<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
  </defs>
  <!-- Background soft circle -->
  <circle cx="100" cy="100" r="90" fill="#f0fdf4" stroke="#dcfce7" stroke-width="4"/>
  
  <!-- Grocery Basket / Bag -->
  <path d="M60 95 L140 95 L130 150 Q128 158 120 158 L80 158 Q72 158 70 150 Z" fill="url(#bagGrad)" />
  
  <!-- Bag Texture Ribs -->
  <path d="M85 102 L82 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M100 102 L100 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  <path d="M115 102 L118 150" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

  <!-- Handles -->
  <path d="M78 95 C78 65, 122 65, 122 95" fill="none" stroke="#15803d" stroke-width="7" stroke-linecap="round"/>
  
  <!-- Organic Leaf Sprout -->
  <path d="M100 68 C80 50, 75 75, 96 82 C100 80, 102 75, 100 68 Z" fill="url(#leafGrad)"/>
  <path d="M100 68 C120 50, 125 75, 104 82 C100 80, 98 75, 100 68 Z" fill="#22c55e"/>
  
  <!-- Sparkles -->
  <circle cx="62" cy="70" r="4" fill="#f59e0b" />
  <circle cx="138" cy="65" r="5" fill="#f59e0b" />
  <circle cx="145" cy="85" r="3" fill="#10b981" />
</svg>
